name: mandate-m2-local
services:
  geth:
    image: ethereum/client-go@sha256:abf3605177f8bdcfce436985a8054cca4ae59256323a4ffb72c56c04f3d1fadd
    command: ["--dev", "--dev.period", "1", "--datadir", "/data", "--cache", "128", "--http", "--http.addr", "0.0.0.0", "--http.api", "eth,net,web3,debug", "--http.vhosts", "localhost,127.0.0.1,geth", "--ipcdisable"]
    ports: ["127.0.0.1:28546:8545"]
    mem_limit: 512m
    cpus: 0.5
    volumes: ["../../.runtime/m2/local-geth:/data"]
  alto:
    user: "${M2_UID}:${M2_GID}"
    image: mandate-m2-alto:ed03b9c
    command: ["node", "src/esm/cli/alto.js", "run", "--config", "/secrets/alto.json"]
    volumes: ["../../.runtime/m2/alto-local-docker.json:/secrets/alto.json:ro"]
    ports: ["127.0.0.1:24340:14337"]
    mem_limit: 512m
    cpus: 0.5
    profiles: ["bundler"]
