[profile.default]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
src = "src"
test = "test"
libs = ["lib"]
remappings = ["forge-std/=lib/forge-std/src/", "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"]

[profile.default.fuzz]
runs = 10000
seed = "0x4022026"

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = false
